{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    <ul class="tags-list">
      {{ range .Data.Terms.ByCount }}
        <li class="tags-list-item">
          {{ partial "icon.html" (dict "ctx" $ "name" "tag") }}
          <a class="tags-list-item-title" href="{{ .Page.RelPermalink }}">
            ({{ .Count }})
            {{- $term := .Term -}}
            {{- with index hugo.Data.tagdisplay $term -}}
              {{ . }}
            {{- else -}}
              {{ $term | title }}
            {{- end -}}
          </a>
        </li>
      {{ end }}
    </ul>
  </article>
{{ end }}
